<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="styletyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A4B" />
      <stop offset="100%" stop-color="#E60023" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#styletyGrad)" />
  
  <!-- Magnifying Glass / Lupa -->
  <g filter="url(#shadow)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Rim -->
    <circle cx="225" cy="225" r="105" stroke-width="32" />
    <!-- Glass Reflection Arc -->
    <path d="M 165 175 A 75 75 0 0 1 245 150" stroke-width="18" stroke-linecap="round" opacity="0.6" />
    <!-- Center Sparkle / Discovery Spark -->
    <path d="M 225 185 L 225 265 M 185 225 L 265 225" stroke-width="16" stroke-linecap="round" />
    <circle cx="225" cy="225" r="14" fill="#FFFFFF" stroke="none" />
    <!-- Handle -->
    <path d="M 302 302 L 400 400" stroke-width="38" />
  </g>
</svg>